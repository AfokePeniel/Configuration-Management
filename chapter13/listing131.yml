---
- name: Creating a user and a group
  hosts: ansible2
  tasks:
  - name: setup the group
    group:
      name: students
      state: present
  - name: set up user account
    user:
      name: anna
      create_home: yes
      groups: wheel, students
      append: yes
      generate_ssh_key: yes
      ssh_key_bits: 2048
      ssh_key_file: .ssh/id_rsa
