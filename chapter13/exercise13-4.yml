---
- name: Create users on localhost
  hosts: localhost
  vars_files:
    - exercise13-4vars.yml
  tasks:
    - name: Include user and group setup
      import_tasks: exercise13-4tasks.yml
    - name: Create a directory
      file:
        name: "{{ item.username }}"
        state: directory
      loop: "{{ users }}"
    - name: copy the local user ssh key to the temporary directory
      shell: 'cat /home/{{ item.username }}/.ssh/id_rsa.pub > {{ item.username }}/id_rsa.pub'
      loop: "{{ users }}"
    - name: Verify that the file exists
      command: ls -l {{ item.username }}/
      loop: "{{ users }}"
  tags: setuplocal

- name: create users on managed nodes
  hosts: ansible2
  vars_files:
  - exercise13-4vars.yml
  tasks:
    - name: Include user and group setup
      import_tasks: exercise13-4tasks.yml
    - name: Add key to authorized_key for passwordless accessibility
      authorized_key:
        user: "{{ item.username }}"
        key: "{{ lookup('file', './' + item.username + '/id_rsa.pub') }}"
      loop: "{{ users }}"
    - name: Copy suoders file
      copy:
        content: '%admins ALL=(ALL:ALL) NOPASSWD:ALL'
        dest: /etc/sudoers.d/admin
    



